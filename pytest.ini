[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests requiring database connections
    slow: Slow running tests
    openai: Tests that require OpenAI API access
    real_db: Tests that require actual database connections

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Minimum version requirements
minversion = 6.0

# Test collection patterns
norecursedirs = 
    .git 
    .tox 
    dist 
    build 
    *.egg 
    venv
    .venv

# Coverage settings (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Filtering settings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning